<style>

const app=document.getElementById("app");

}
function head(t){return '<header class="bar"><button class="back" onclick="menu()">← BACK</button><div class="title">'+t+'</div><span style="font-size:8px;color:#66716b">BUILD 0.2</span></header>'}
function mapsScreen(){
let cards=maps.map((m,i)=>'<button class="card '+(i===selectedMap?"sel":"")+'" onclick="selectedMap='+i+';mapsScreen()"><div class="art">'+m[1]+'<br>AO 00'+(i+1)+'</div><div class="info"><b>'+m[0]+'</b><small>'+m[1]+' // '+m[2]+'</small><em>'+((i===0)?"READY":"TRAINING")+'</em><p>Fully playable test area with enemies, objectives, doors, combat and extraction flow.</p><footer><span>OP 00'+(i+1)+'</span><span>PLAYABLE</span></footer></div></button>').join("");
app.innerHTML='<main class="screen">'+head("MISSION SELECT")+'<div class="content"><div class="head"><div><span>OPERATIONS</span><h2>SELECT AO</h2></div><span>3 OPERATIONS</span></div><div class="cards">'+cards+'</div><div class="row" style="display:flex;justify-content:space-between;align-items:center;margin-top:25px;font-size:9px;color:#69746d">SELECTED <b>'+maps[selectedMap][0]+'</b><button class="action" onclick="startGame()">START OPERATION ›</button></div></div></main>';
}
function loadout(){
let ws=guns.map((g,i)=>'<button class="weapon '+(i===selectedGun?"sel":"")+'" onclick="selectedGun='+i+';loadout()"><b>'+g[0]+'</b><span>'+g[1]+'</span><small>MAG '+g[2]+' // RESERVE '+g[3]+' // DAMAGE '+g[5]+'</small></button>').join("");
app.innerHTML='<main class="screen">'+head("LOADOUT")+'<div class="content"><div class="head"><div><span>PRIMARY WEAPON</span><h2>SELECT PLATFORM</h2></div></div><div class="weapons">'+ws+'</div></div></main>';
}
function briefing(){
app.innerHTML='<main class="screen">'+head("OPERATION BRIEF")+'<div class="content brief"><div class="class">CLASSIFICATION // RESTRICTED</div><h2>OPERATION NIGHTFALL</h2><p>Hostile activity has been detected inside the structure. Clear the lobby, secure the corridor and reach the extraction door. Use cover, control your movement and conserve ammunition.</p><div class="facts"><div><span>THREAT</span><b>ARMED</b></div><div><span>ROE</span><b>CONTROLLED</b></div><div><span>TEAM</span><b>SOLO</b></div></div><button class="action" onclick="startGame()">ACCEPT OPERATION ›</button></div></main>';
}

let G=null;
const MAP=[
"################",
"#..............#",
"#..####..####..#",
"#..#..#..#..#..#",
"#..#..#..#..#..#",
"#..#..####..#..#",
"#..............#",
"#..###....###..#",
"#..#..........##",
"#..#..####....##",
"#..#..#..#.....#",
"#.....#..#.....#",
"#..####..####..#",
"#..............#",
"#..............#",
"################"
];
const TILE=1;
function isWall(x,y){return MAP[Math.floor(y)]?.[Math.floor(x)]==="#"}
function canMove(x,y,r=.18){return !isWall(x-r,y-r)&&!isWall(x+r,y-r)&&!isWall(x-r,y+r)&&!isWall(x+r,y+r)}
function dist(a,b,c,d){return Math.hypot(a-c,b-d)}
function lineClear(x1,y1,x2,y2){const n=Math.ceil(dist(x1,y1,x2,y2)*12);for(let i=1;i<n;i++){const t=i/n;if(isWall(x1+(x2-x1)*t,y1+(y2-y1)*t))return false}return true}
function startGame(){
const c=document.createElement("canvas");c.id="view";
app.innerHTML='<main id="game"></main>';document.getElementById("game").appendChild(c);
const g=document.getElementById("game");
g.insertAdjacentHTML("beforeend",'<canvas id="minimap" width="128" height="128"></canvas><div class="hud"><div class="hudtop"><span>BREACHLINE</span><span>OP 001 // NIGHTFALL HOTEL</span></div><div class="obj"><small>OBJECTIVE</small><b id="objective">CLEAR THE LOBBY</b><small id="threatText">▲ 0 / 5 THREATS</small></div><div class="cross">+</div><div class="weaponHud"><b>'+guns[selectedGun][0]+'</b><span>'+guns[selectedGun][1]+'</span><strong id="ammo">30</strong><span> / <b id="reserve">120</b></span></div><div class="health"><span>ARMOR <b id="hp">100%</b></span><div class="hp"><i id="bar" style="width:100%"></i></div></div></div><div class="controls"><div class="stick leftStick" id="leftStick"><div class="knob"></div></div><div class="stick rightStick" id="rightStick"><div class="knob"></div></div><button class="btn fire" id="fire">FIRE</button><button class="btn reload" id="reload">RELOAD</button><button class="btn aim" id="aim">AIM</button><button class="btn crouch" id="crouch">CROUCH</button><button class="btn interact" id="interact">USE</button><button class="btn sprint" id="sprint">RUN</button></div><div id="banner"></div><div id="end"><div class="endbox"><h2 id="endTitle"></h2><p id="endText"></p><button onclick="startGame()">REDEPLOY</button><button onclick="menu()" style="margin-left:8px;background:#222a25;color:#cbd5c4">MENU</button></div></div>';
initGame(c);
}
function initGame(canvas){
const ctx=canvas.getContext("2d");let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();
const player={x:2.2,y:13.5,a:-Math.PI/2,hp:100,ammo:30,reserve:120,speed:2.2,running:false,crouch:false,aim:false};
const enemySpawns=[[5.5,2.8],[10.5,3.5],[7.5,6.2],[3.5,8.5],[12.5,11.5]];
const enemies=enemySpawns.map((p,i)=>({x:p[0],y:p[1],hp:2,alive:true,shoot:1+i*.5,alert:false}));
const exit={x:13.5,y:13.5};
const input={lx:0,ly:0,rx:0,ry:0,fire:false,run:false,aim:false,crouch:false};
let last=performance.now(),muzzle=0,flash=0,kills=0,gameOver=false,win=false;
const FOV=Math.PI/3;
function banner(t){const b=document.getElementById("banner");b.textContent=t;b.style.display="block";clearTimeout(banner.t);banner.t=setTimeout(()=>b.style.display="none",1300)}
function updateHud(){document.getElementById("ammo").textContent=String(player.ammo).padStart(2,"0");document.getElementById("reserve").textContent=player.reserve;document.getElementById("hp").textContent=Math.max(0,Math.round(player.hp))+"%";document.getElementById("bar").style.width=Math.max(0,player.hp)+"%";document.getElementById("threatText").textContent="▲ "+kills+" / "+enemies.length+" THREATS";document.getElementById("objective").textContent=kills===enemies.length?"REACH EXTRACTION":"CLEAR THE LOBBY"}
function sound(freq=180,dur=.05,type="square"){try{const A=window.AudioContext||window.webkitAudioContext;if(!window._ac)window._ac=new A();const ac=window._ac;if(ac.state==="suspended")ac.resume();const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=freq;v.gain.setValueAtTime(.05,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch(e){}}
function shoot(){
if(gameOver)return;if(player.ammo<=0){sound(90,.08,"sawtooth");banner("EMPTY — RELOAD");return}
player.ammo--;muzzle=.08;sound(player.aim?390:300,.045,"square");
let best=null,bestD=99;
for(const e of enemies)if(e.alive){const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy),ang=Math.atan2(dy,dx);let da=Math.atan2(Math.sin(ang-player.a),Math.cos(ang-player.a));if(Math.abs(da)<(player.aim?.06:.095)&&d<bestD&&lineClear(player.x,player.y,e.x,e.y)){best=e;bestD=d}}
if(best){best.hp--;flash=.12;if(best.hp<=0){best.alive=false;kills++;sound(620,.09,"triangle");banner("TARGET DOWN")}else{sound(470,.05,"triangle");banner("HIT")}}updateHud()}
function reload(){if(player.ammo>=30||player.reserve<=0)return;const n=Math.min(30-player.ammo,player.reserve);player.ammo+=n;player.reserve-=n;sound(130,.12,"sawtooth");banner("RELOADING");setTimeout(updateHud,450)}
function damage(v){player.hp-=v;flash=.18;if(player.hp<=0){player.hp=0;end(false,"OPERATOR DOWN","You were neutralized. Restart the operation.");}updateHud()}
function end(ok,title,text){gameOver=true;const e=document.getElementById("end");e.style.display="flex";document.getElementById("endTitle").textContent=title;document.getElementById("endText").textContent=text}
function interact(){if(kills<enemies.length){banner("EXTRACTION LOCKED");return}if(dist(player.x,player.y,exit.x,exit.y)<1.4){win=true;end(true,"MISSION COMPLETE","Lobby secured. Extraction point reached.");sound(720,.2,"triangle")}else banner("MOVE TO EXTRACTION")}
function move(dt){
let mx=input.ly,my=input.lx; // left stick Y is forward
let turn=input.rx*2.5*dt;player.a+=turn;
let forward=-mx*(player.running?3.5:player.speed)*dt,strafe=my*(player.running?3.0:player.speed)*dt;
let nx=player.x+Math.cos(player.a)*forward+Math.cos(player.a+Math.PI/2)*strafe;
let ny=player.y+Math.sin(player.a)*forward+Math.sin(player.a+Math.PI/2)*strafe;
if(canMove(nx,player.y,.17))player.x=nx;if(canMove(player.x,ny,.17))player.y=ny;
player.running=input.run&&Math.abs(input.ly)>.35&&!player.crouch;player.aim=input.aim;player.crouch=input.crouch;
for(const e of enemies)if(e.alive){const d=dist(e.x,e.y,player.x,player.y);if(d<7&&lineClear(e.x,e.y,player.x,player.y))e.alert=true;if(e.alert&&d>1.7){const a=Math.atan2(player.y-e.y,player.x-e.x),s=.48*dt;const ex=e.x+Math.cos(a)*s,ey=e.y+Math.sin(a)*s;if(canMove(ex,e.y,.16))e.x=ex;if(canMove(e.x,ey,.16))e.y=ey}if(e.alert&&d<8&&lineClear(e.x,e.y,player.x,player.y)){e.shoot-=dt;if(e.shoot<=0){e.shoot=1.8+Math.random();damage(5+Math.random()*4)}}}
if(kills===enemies.length&&dist(player.x,player.y,exit.x,exit.y)<1.7)banner("EXTRACTION READY");
}
function cast(a){let x=player.x,y=player.y;const step=.025,dx=Math.cos(a)*step,dy=Math.sin(a)*step;let d=0;while(d<24){x+=dx;y+=dy;d+=step;if(isWall(x,y))return d}return 24}
function render(){
ctx.clearRect(0,0,W,H);const horizon=H*.5+(player.crouch?35:0),floor=ctx.createLinearGradient(0,horizon,0,H);floor.addColorStop(0,"#252b27");floor.addColorStop(1,"#070907");ctx.fillStyle="#58605a";ctx.fillRect(0,0,W,horizon);ctx.fillStyle=floor;ctx.fillRect(0,horizon,W,H-horizon);
const rays=Math.min(Math.floor(W/2),420);const rw=W/rays;
for(let i=0;i<rays;i++){const a=player.a-FOV/2+FOV*(i/rays),raw=cast(a),d=raw*Math.cos(a-player.a),wallH=Math.min(H*2,H/(d*.75)),top=horizon-wallH/2;const shade=Math.max(25,150-d*11);ctx.fillStyle="rgb("+shade+","+Math.min(170,shade+10)+","+Math.min(150,shade+5)+")";ctx.fillRect(i*rw,top,rw+1,wallH)}
for(const e of enemies.filter(x=>x.alive).sort((a,b)=>dist(b.x,b.y,player.x,player.y)-dist(a.x,a.y,player.x,player.y))){
const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy),ang=Math.atan2(dy,dx);let da=Math.atan2(Math.sin(ang-player.a),Math.cos(ang-player.a));if(Math.abs(da)>FOV*.65)continue;const sx=W/2+Math.tan(da)/(Math.tan(FOV/2))*W/2,size=Math.min(H*.75,H/(d*.8));if(size<5)continue;const sy=horizon-size*.45;ctx.fillStyle="#0a0d0b";ctx.fillRect(sx-size*.18,sy+size*.2,size*.36,size*.55);ctx.beginPath();ctx.arc(sx,sy+size*.1,size*.16,0,Math.PI*2);ctx.fill();ctx.fillStyle="#8c9b84";ctx.fillRect(sx-size*.18,sy+size*.76,size*.36,4)}
drawMinimap();if(muzzle>0){ctx.fillStyle="rgba(210,235,170,.65)";ctx.beginPath();ctx.moveTo(W*.72,H*.86);ctx.lineTo(W*.78,H*.66);ctx.lineTo(W*.84,H*.86);ctx.fill()}if(flash>0){ctx.fillStyle="rgba(255,50,35,.22)";ctx.fillRect(0,0,W,H)}}
function drawMinimap(){const m=document.getElementById("minimap"),mc=m.getContext("2d"),s=8;mc.clearRect(0,0,128,128);for(let y=0;y<16;y++)for(let x=0;x<16;x++){mc.fillStyle=MAP[y][x]==="#"?"#303833":"#101511";mc.fillRect(x*s,y*s,s,s)}mc.fillStyle="#a7bd80";mc.beginPath();mc.arc(player.x*s,player.y*s,3,0,Math.PI*2);mc.fill();mc.strokeStyle="#a7bd80";mc.beginPath();mc.moveTo(player.x*s,player.y*s);mc.lineTo((player.x+Math.cos(player.a)*1.2)*s,(player.y+Math.sin(player.a)*1.2)*s);mc.stroke();for(const e of enemies)if(e.alive){mc.fillStyle="#d45a4d";mc.fillRect(e.x*s-2,e.y*s-2,4,4)}mc.fillStyle="#cfd8bc";mc.fillRect(exit.x*s-2,exit.y*s-2,4,4)}
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(!gameOver){move(dt);muzzle=Math.max(0,muzzle-dt);flash=Math.max(0,flash-dt);render();}requestAnimationFrame(loop)}
function bindStick(id,which){const el=document.getElementById(id),kn=el.querySelector(".knob");let pid=null;function set(e){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.32,n=Math.hypot(dx,dy);if(n>max){dx=dx/n*max;dy=dy/n*max}kn.style.transform="translate("+dx+"px,"+dy+"px)";if(which==="left"){input.lx=dx/max;input.ly=dy/max}else{input.rx=dx/max;input.ry=dy/max}}el.addEventListener("pointerdown",e=>{pid=e.pointerId;el.setPointerCapture(pid);set(e)});el.addEventListener("pointermove",e=>{if(e.pointerId===pid)set(e)});el.addEventListener("pointerup",e=>{if(e.pointerId===pid){pid=null;kn.style.transform="";if(which==="left"){input.lx=0;input.ly=0}else{input.rx=0;input.ry=0}}});el.addEventListener("pointercancel",()=>{pid=null;kn.style.transform="";if(which==="left"){input.lx=0;input.ly=0}else{input.rx=0;input.ry=0}})}
function hold(id,on,off){const el=document.getElementById(id);el.addEventListener("pointerdown",e=>{e.preventDefault();on();});["pointerup","pointercancel","pointerleave"].forEach(x=>el.addEventListener(x,e=>{e.preventDefault();off&&off()}))}
bindStick("leftStick","left");bindStick("rightStick","right");
hold("fire",()=>{input.fire=true;shoot()},()=>input.fire=false);hold("aim",()=>input.aim=true,()=>input.aim=false);hold("crouch",()=>input.crouch=true,()=>input.crouch=false);hold("sprint",()=>input.run=true,()=>input.run=false);
document.getElementById("reload").addEventListener("pointerdown",reload);document.getElementById("interact").addEventListener("pointerdown",interact);
addEventListener("keydown",e=>{if(e.code==="Space")shoot();if(e.code==="KeyR")reload();if(e.code==="KeyE")interact();if(e.code==="ShiftLeft")input.run=true;if(e.code==="ControlLeft")input.crouch=true;if(e.code==="Mouse0")shoot()});
addEventListener("keyup",e=>{if(e.code==="ShiftLeft")input.run=false;if(e.code==="ControlLeft")input.crouch=false});
canvas.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")shoot()});
updateHud();banner("MISSION START");requestAnimationFrame(loop);
}
