<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BREACHLINE: MOBILE — Prototype 0.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#060807;color:#e8ece7;font-family:Arial,sans-serif}button{font:inherit;color:inherit;border:0;cursor:pointer}.shell{min-height:100vh;background:radial-gradient(circle at 70% 15%,#25302b,#0c1110 38%,#050606 78%);padding-bottom:40px}.top{height:76px;padding:15px 6vw;border-bottom:1px solid #28302d;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:3px;font-size:23px}.brand small{display:block;font-size:8px;color:#78847c;letter-spacing:2px}.status{font-size:9px;color:#839087;letter-spacing:2px}.hero{padding:8vh 8vw 3vh}.ey{font-size:10px;letter-spacing:4px;color:#91a096}.hero h1{font-size:clamp(70px,14vw,160px);line-height:.8;margin:18px 0;font-weight:900;letter-spacing:-5px}.hero h1 i{font-style:normal;color:#a7bd80}.hero p{font-size:10px;letter-spacing:8px;color:#89948d}.line{width:270px;height:2px;background:#a7bd80;margin-top:28px}.menu{width:min(700px,84vw);margin:4vh 8vw}.menu button{width:100%;display:flex;gap:18px;align-items:center;text-align:left;padding:19px;background:#101513;border:1px solid #29312e;margin:8px 0}.menu button:hover{border-color:#a7bd80;background:#171e1a}.icon{font-size:22px;color:#a7bd80;width:28px}.menu div{flex:1}.menu b{display:block;font-size:19px;letter-spacing:1px}.menu small{font-size:9px;color:#727d76;letter-spacing:1px}.quick{margin:20px 8vw;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.quick button,.action{background:#a7bd80;color:#071008;padding:14px 20px;font-weight:800}.quick span{font-size:9px;color:#68746d;letter-spacing:1px}footer{margin:50px 8vw;color:#465049;font-size:8px;letter-spacing:1px;display:flex;justify-content:space-between}.screen{min-height:100vh;background:radial-gradient(circle at 60% 10%,#202a25,#070908 65%)}.bar{height:72px;padding:15px 5vw;border-bottom:1px solid #29312e;display:flex;align-items:center;justify-content:space-between}.back{background:none;color:#a8b4ac;font-size:10px;letter-spacing:2px}.title{font-weight:800;letter-spacing:2px}.content{padding:45px 7vw}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #29312e;padding-bottom:20px}.head span{font-size:9px;color:#819087;letter-spacing:3px}.head h2{font-size:42px;margin:5px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}.card{background:#101513;border:1px solid #29312e;text-align:left}.card.sel{border-color:#a7bd80}.art{height:170px;display:grid;place-items:center;background:linear-gradient(145deg,#223029,#0b0f0d);color:#82927f;font-size:12px;letter-spacing:3px}.warehouse{background:linear-gradient(145deg,#393126,#10100e)}.compound{background:linear-gradient(145deg,#332c23,#10100e)}.info{padding:16px}.info b{font-size:20px}.info small{display:block;color:#748078;font-size:8px;margin-top:4px}.info p{font-size:10px;color:#8a958e;line-height:1.5;min-height:50px}.info em{float:right;color:#a7bd80;font-size:8px;font-style:normal}.info footer{margin:0;display:flex;justify-content:space-between;font-size:8px}.row{display:flex;justify-content:space-between;align-items:center;margin-top:25px;font-size:9px;color:#69746d;letter-spacing:1px}.weapons{display:grid;grid-template-columns:1fr 1fr;gap:18px}.weapon{background:#101513;border:1px solid #29312e;padding:28px;text-align:left}.weapon.sel{border-color:#a7bd80}.weapon b{display:block;font-size:29px}.weapon span{display:block;color:#8b968f;font-size:10px;margin:8px 0}.weapon small{font-size:8px;color:#657069}.brief{max-width:750px}.brief .class{color:#a7bd80;font-size:9px;letter-spacing:3px}.brief h2{font-size:56px;margin:15px 0}.brief p{color:#929d96;line-height:1.8;font-size:13px}.facts{display:flex;gap:55px;border-top:1px solid #29312e;border-bottom:1px solid #29312e;padding:24px 0;margin:28px 0}.facts span,.facts b{display:block}.facts span{font-size:8px;color:#68746d;letter-spacing:2px}.facts b{font-size:18px;margin-top:5px}.game{height:100vh;position:relative;overflow:hidden;background:linear-gradient(#4a504b 0 23%,#2a2e29 23% 55%,#111411 55%)}.ceiling{position:absolute;top:0;left:0;right:0;height:26%;background:repeating-linear-gradient(90deg,#3b403c 0 100px,#303530 101px 104px)}.room{position:absolute;inset:25% 8% 0;background:linear-gradient(90deg,#171b18,#30352f 50%,#171b18)}.door{position:absolute;left:38%;top:6%;width:25%;height:72%;border:8px solid #252a26;background:linear-gradient(90deg,#101411,#4b4e48,#111411);display:grid;place-items:center;font-size:65px;font-weight:900;color:#727b72}.enemy{position:absolute;right:22%;bottom:18%;width:65px}.enemy .head{width:42px;height:48px;background:#10130f;border-radius:50%;margin:auto}.enemy .body{height:120px;background:#10130f;border-radius:18px}.hud{position:absolute;inset:0;padding:20px 28px}.hudtop{display:flex;justify-content:space-between;font-size:9px;letter-spacing:2px}.obj{position:absolute;top:90px;left:30px;border-left:2px solid #a7bd80;padding-left:10px}.obj small{font-size:8px;color:#859088}.obj b{display:block;font-size:23px;margin:4px 0}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;color:#a7bd80}.gun{position:absolute;right:30px;bottom:105px;text-align:right}.gun b{display:block;font-size:24px}.gun span{font-size:8px;color:#7f8a83}.gun strong{font-size:55px}.health{position:absolute;left:30px;bottom:105px}.health span{display:block;font-size:8px;color:#819087}.hp{width:140px;height:4px;background:#2e352f;margin-top:7px}.hp i{display:block;height:100%;background:#a7bd80}.controls{position:absolute;bottom:22px;left:28px;right:28px;display:flex;gap:12px}.controls span{font-size:8px;color:#68746d;padding-top:12px}.controls button{background:#a7bd80;color:#071008;padding:11px 16px;font-size:9px;font-weight:800}.controls .exit{margin-left:auto;background:#252b27;color:#a4aea7}@media(max-width:760px){.cards,.weapons{grid-template-columns:1fr}.cards .card:nth-child(n+3){display:none}.hero{padding-top:5vh}.menu{margin-top:2vh}.top{padding:14px 20px}.content{padding:30px 20px}.brief h2{font-size:44px}.facts{gap:25px}.controls span{display:none}.room{inset:25% 0 0}.gun{right:18px}.hud{padding:16px}}
</style></head><body><div id="app"></div><script>
const maps=[['NIGHTFALL HOTEL','Urban / Interior','NORMAL','02:15','Multi-floor luxury hotel. Tight corridors, service halls and stairwells.','hotel'],['BLACK DOCKS','Industrial / Interior','HARD','04:30','Freight warehouse with open lanes, containers and elevated catwalks.','warehouse'],['REDLINE COMPOUND','Rural / Exterior','HARD','05:10','Perimeter breach around a fortified compound.','compound']];const guns=[['VX-5 CARBINE','5.56 NATO','82','MID'],['K-9 PDW','9mm','66','CLOSE']];let selectedMap=0,selectedGun=0,shots=0,hp=100;const app=document.getElementById('app');
function menu(){app.innerHTML=`<main class=shell><div class=top><div class=brand>BREACHLINE<small>MOBILE // PROTOTYPE 0.1</small></div><div class=status>● ONLINE &nbsp; BUILD 0.1.0</div></div><section class=hero><div class=ey>TACTICAL RESPONSE UNIT</div><h1>BREACH<i>LINE</i></h1><p>PRECISION. DISCIPLINE. CONTROL.</p><div class=line></div></section><nav class=menu><button onclick=mapsScreen()><span class=icon>▣</span><div><b>MISSION SELECT</b><small>Choose operation</small></div>›</button><button onclick=loadout()><span class=icon>◈</span><div><b>LOADOUT</b><small>${guns[selectedGun][0]}</small></div>›</button><button onclick=briefing()><span class=icon>⊙</span><div><b>OPERATION BRIEF</b><small>Threat intelligence</small></div>›</button><button style="opacity:.45"><span class=icon>⚙</span><div><b>SETTINGS</b><small>Controls / graphics / audio</small></div>🔒</button></nav><div class=quick><button onclick=game()>▶ DEPLOY NOW</button><span>MISSION: ${maps[selectedMap][0]}</span><span>WEAPON: ${guns[selectedGun][0]}</span></div><footer><span>© 2026 BREACHLINE: MOBILE</span><span>ORIGINAL IP // PROTOTYPE</span></footer></main>`}function head(t){return `<header class=bar><button class=back onclick=menu()>← BACK</button><div class=title>${t}</div><span style="font-size:8px;color:#66716b">BREACHLINE // 0.1</span></header>`}function mapsScreen(){app.innerHTML=`<main class=screen>${head('MISSION SELECT')}<div class=content><div class=head><div><span>OPERATIONS</span><h2>SELECT AO</h2></div><span>3 OPERATIONS</span></div><div class=cards>${maps.map((m,i)=>`<button class="card ${i===selectedMap?'sel':''}" onclick="${i<2 ? "selectedMap="+i+";mapsScreen()" : ""}"><div class="art ${m[5]}">▣<br>${m[5].toUpperCase()}</div><div class=info><b>${m[0]}</b><small>${m[1]}</small><em>${i===2?'LOCKED':m[2]}</em><p>${m[4]}</p><footer><span>TIME ${m[3]}</span><span>${i===2?'REQUIRES LEVEL 8':'READY'}</span></footer></div></button>`).join('')}</div><div class=row>SELECTED <b>${maps[selectedMap][0]}</b><button class=action onclick=game()>START OPERATION ›</button></div></div></main>`}function loadout(){app.innerHTML=`<main class=screen>${head('LOADOUT')}<div class=content><div class=head><div><span>PRIMARY WEAPON</span><h2>SELECT PLATFORM</h2></div></div><div class=weapons>${guns.map((g,i)=>`<button class="weapon ${i===selectedGun?'sel':''}" onclick="selectedGun=${i};loadout()"><b>${g[0]}</b><span>${g[1]}</span><small>DAMAGE ${g[2]} // RANGE ${g[3]}</small></button>`).join('')}</div></div></main>`}function briefing(){app.innerHTML=`<main class=screen>${head('OPERATION BRIEF')}<div class="content brief"><div class=class>CLASSIFICATION // RESTRICTED</div><h2>OPERATION NIGHTFALL</h2><p>Hostile activity has been detected inside the selected structure. Your unit is tasked with securing the first floor, locating the breach point and extracting without civilian casualties.</p><div class=facts><div><span>THREAT</span><b>UNKNOWN</b></div><div><span>ROE</span><b>CONTROLLED</b></div><div><span>TEAM</span><b>SOLO</b></div></div><button class=action onclick=game()>ACCEPT OPERATION ›</button></div></main>`}function game(){shots=0;hp=100;app.innerHTML=`<main class=game><div class=ceiling></div><div class=room><div class=door>07</div><div class=enemy><div class=head></div><div class=body></div></div></div><div class=hud><div class=hudtop><span>BREACHLINE</span><span>OP 001 // ${maps[selectedMap][0]}</span></div><div class=obj><small>OBJECTIVE</small><b>CLEAR THE LOBBY</b><small>▲ 0 / 3 THREATS</small></div><div class=cross>┼</div><div class=gun><b>${guns[selectedGun][0]}</b><span>${guns[selectedGun][1]}</span><strong id=ammo>30</strong><span> / 120</span></div><div class=health>ARMOR <b id=hp>${hp}%</b><div class=hp><i id=bar style="width:100%"></i></div></div><div class=controls><span>WASD MOVE</span><span>SPACE / TAP FIRE</span><button onclick=fire()>◎ FIRE</button><button class="exit" onclick=menu()>EXIT</button></div></div></main>`;document.onkeydown=e=>{if(e.code==='Space')fire()}}function fire(){shots++;hp=Math.max(20,hp-2);document.getElementById('ammo').textContent=String(30-(shots%31)).padStart(2,'0');document.getElementById('hp').textContent=hp+'%';document.getElementById('bar').style.width=hp+'%'}menu();
</script></body></html>
